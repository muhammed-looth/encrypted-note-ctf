<!DOCTYPE html>
<html>
<head>
  <title>Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      color: #6c757d;
      text-align: center;
      padding: 100px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 5rem;
      font-weight: 700;
      color: #dee2e6;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops! This page doesn't exist.</p>
    <p><a href="/">← Back to Home</a></p>
  </div>
</body>
</html>
