<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Labyrinth</title>
<style>
  body {
    background: #623a2f;
    color: #e2d6c7;
    font-family: 'Times New Roman', serif;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-gap: 10px;
    padding: 50px;
  }
  div {
    background: #754c35;
    border: 2px solid #bda085;
    padding: 20px;
    text-align: center;
    font-size: 1.5rem;
    box-shadow: inset 0 0 10px #000;
    cursor: pointer;
    user-select: none;
  }
  div:hover {
    background: #bda085;
    color: #623a2f;
  }
</style>
</head>
<body>
  <div>LA</div>
  <div>BY</div>
  <div>RIN</div>
  <div>TH</div>
  <div>...</div>
  <div>...</div>
  <div>...</div>
  <div>...</div>
  <div>...</div>
  <div>...</div>
</body>
</html>
