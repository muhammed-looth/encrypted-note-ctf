<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PuzzleBox</title>
<style>
  body {
    background: #f0f0f0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .puzzle-piece {
    font-size: 6rem;
    color: #333;
    width: 120px;
    height: 120px;
    line-height: 120px;
    margin: 5px;
    background: #9acd32;
    border-radius: 12px;
    box-shadow: 3px 3px 10px #888;
    transform: rotate(-10deg);
  }
</style>
</head>
<body>
  <div class="puzzle-piece">PUZ</div>
  <div class="puzzle-piece">ZLE</div>
  <div class="puzzle-piece">BOX</div>
</body>
</html>
