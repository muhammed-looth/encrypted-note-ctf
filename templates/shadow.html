<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Terminal | CTF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shadow.css') }}">
</head>
<body>

<div class="terminal-container">
    <div class="scanline"></div>

    <div class="terminal-screen">
        <h1 class="title">E C H O — T E R M I N A L</h1>
        <p class="subtitle">Nothing hides in plain sight.<br>But the echoes remember.</p>

        <div id="terminalOutput" class="terminal-output"></div>

        <div class="input-row">
            <span class="prompt">></span>
            <input id="terminalInput" autocomplete="off" class="terminal-input" />
        </div>
    </div>
</div>

<audio id="glitchSound" src="{{ url_for('static', filename='audio/glitch.wav') }}"></audio>
<audio id="pulseSound" src="{{ url_for('static', filename='audio/pulse.wav') }}"></audio>
<audio id="unlockSound" src="{{ url_for('static', filename='audio/unlock.wav') }}"></audio>

<script src="{{ url_for('static', filename='js/shadow.js') }}"></script>

</body>
</html>
