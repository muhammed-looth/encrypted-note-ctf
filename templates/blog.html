<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Me | Personal Blog</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/blog.css') }}" />
</head>
<body>

  <div class="blog-container">
    <header class="blog-header">
      <h1>Welcome to My Personal Blog</h1>
      <p>Sharing my contact details and little about me.</p>
    </header>

    <section class="contact-section">
      <h2>Contact Info</h2>
      <div class="contact-card">
        <div class="icon phone-icon"></div>
        <div class="contact-info">
          <h3>Phone Number</h3>
          <p id="phoneNumber">+91 92436 75018</p>
          <button id="copyBtn" title="Click to copy phone number">Copy Number</button>
          <div id="copyMsg" class="copy-message">Copied to clipboard!</div>
        </div>
      </div>

      <div class="contact-card">
        <div class="icon email-icon"></div>
        <div class="contact-info">
          <h3>Email Address</h3>
          <p>youremail@example.com</p>
        </div>
      </div>

      <div class="contact-card">
        <div class="icon location-icon"></div>
        <div class="contact-info">
          <h3>Location</h3>
          <p>Your City, Your Country</p>
        </div>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/blog.js') }}"></script>
</body>
</html>
