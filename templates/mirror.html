<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>M I R R O R | CTF Challenge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mirror.css') }}" />
</head>
<body>
  <div class="mirror-wrap">
    <div class="mirror-frame">
      <div class="header">
        <h1>M I R R O R</h1>
        <p class="hint">Reflect. Replicate. Reward.</p>
      </div>

      <div class="play-area">
        <canvas id="mirrorCanvas"></canvas>
        <div class="divider"></div>
      </div>

      <div class="controls">
        <button id="resetBtn">RESET</button>
        <span class="status">Draw anywhere (left OR right)</span>
      </div>

      <div id="revealBox" class="reveal-box" style="display:none;">
        🔮 Mirror Key — PART 12 🔮<br/>
        <code>aW1hZ2luZS1taXJyb3ItcGFydC0xMg==</code><br/>
        NEXT → https://encrypted-note-ctf.onrender.com/YOUR_NEXT_PATH
      </div>
    </div>
  </div>

  <audio id="scribble" src="{{ url_for('static', filename='audio/scribble.wav') }}"></audio>
  <audio id="matchSound" src="{{ url_for('static', filename='audio/match.m4a') }}"></audio>
  <audio id="failSound" src="{{ url_for('static', filename='audio/fail.flac') }}"></audio>

  <script src="{{ url_for('static', filename='js/mirror.js') }}"></script>
</body>
</html>
